
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: 'Set up Python'

  - script: |
      python --version
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest
    workingDirectory: '$(Build.SourcesDirectory)/NoteNest'
    displayName: 'Install dependencies'

  - script: |
      python -m pytest tests --junitxml=$(Common.TestResultsDirectory)/test-results.xml
    workingDirectory: '$(Build.SourcesDirectory)/NoteNest'
    displayName: 'Run NoteNest tests'

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Common.TestResultsDirectory)/test-results.xml'
      failTaskOnFailedTests: true
    condition: succeededOrFailed()
    displayName: 'Publish test results'
